<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link href="https://googleapis.com" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" media="screen" />
  </head>
  <body>
    <header class="matrix-banner">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower matrix diagram" />
      <a class="matrix-link" href="https://goal-life.com">Want more details?</a>
    </header>

    <main class="todo-app">
      <h1 class="visual-hidden">Task Manager with Eisenhower Matrix</h1>

      <section class="task-creator">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task" type="text" />
          <button type="button">Add</button>
        </div>
      </section>

      <section class="task-list-section">
        <h2>Todo</h2>
        <ul id="incompleteTasks">
          <li>
            <input type="checkbox" />
            <label class="task">Pay Bills</label>
            <input type="text" class="task" />
            <button type="button" class="edit">Edit</button>
            <button type="button" class="delete">
              <img src="./remove.svg" alt="Remove task" />
            </button>
          </li>
          <li class="editMode">
            <input type="checkbox" />
            <label class="task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task" />
            <button type="button" class="edit">Save</button>
            <button type="button" class="delete">
              <img src="./remove.svg" alt="Remove task" />
            </button>
          </li>
        </ul>
      </section>

      <section class="task-list-section">
        <h2>Completed</h2>
        <ul id="completed-tasks">
          <li>
            <input type="checkbox" checked />
            <label class="task">See the Doctor</label>
            <input type="text" class="task" />
            <button type="button" class="edit">Edit</button>
            <button type="button" class="delete">
              <img src="./remove.svg" alt="Remove task" />
            </button>
          </li>
        </ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
